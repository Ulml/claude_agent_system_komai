[project]
name = "template-lm-contracts"
version = "1.0.0"
description = "Shared Pydantic contracts of the Template_LM AI Operating System."
requires-python = ">=3.11"
dependencies = ["pydantic>=2.7"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["contracts"]
